name: "Epic"
description: "Coordinate a finite outcome through independently reviewable sub-issues."
labels: ["type:epic", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Use <Area> or Project: <finite outcome> as the title. Use native sub-issues for implementation; the umbrella branch is for integration only."
  - type: textarea
    id: outcome
    attributes:
      label: "Outcome"
      description: "Define the completed result and its value."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Scope"
      description: "Included capabilities and explicit non-goals."
    validations:
      required: true
  - type: textarea
    id: decomposition
    attributes:
      label: "Decomposition"
      description: "Propose reviewable leaves. Use native relationships for the lasting child list."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance criteria"
      description: "Combined behavior, integration and documentation required to finish the epic."
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: "Validation plan"
      description: "How the integrated outcome will be checked."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      description: "Hard prerequisites and any essential sequencing."
