name: Bug report
description: Report a reproducible standalone failure.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: environment
    attributes:
      label: Build and environment
      description: Commit, Windows version, compiler, Debug/Release, EXE/DLL, cheats, map/seed if known.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Exact steps and observed behavior. Do not attach game resource files.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and debugger evidence
      description: Relevant log excerpt or stack, and how frequently the failure occurs.
  - type: textarea
    id: acceptance
    attributes:
      label: Suggested acceptance criteria
      description: Behavior and regression checks that would demonstrate a fix.
