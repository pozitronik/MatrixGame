name: Windows standalone CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master, 'epic/**']
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Contribution policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate the label catalog and policy contracts
        run: |
          python3 -B .github/scripts/check-contribution-policy.py catalog
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Validate pull request metadata
        if: github.event_name == 'pull_request'
        run: python3 -B .github/scripts/check-contribution-policy.py pr --input "$GITHUB_EVENT_PATH" --event

  repository:
    name: Repository checks
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify local-only content is excluded
        shell: pwsh
        env:
          CHECK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $base = $env:CHECK_BASE_SHA
          if (-not $base -or $base -match '^0+$') { $base = 'HEAD^' }
          ./tools/check-repository.ps1 -BaseRef $base
      - name: Verify build-tool and packaging contracts
        shell: pwsh
        run: python -B -m unittest discover -s tests -p 'test_*.py'

  build:
    name: ${{ matrix.name }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: MinGW
            configuration: Debug
            target: EXE
            cheats: false
            name: MinGW Debug EXE
          - compiler: MinGW
            configuration: Release
            target: EXE
            cheats: false
            name: MinGW Release EXE
          - compiler: MSVC
            configuration: Debug
            target: EXE
            cheats: false
            name: MSVC Debug EXE
          - compiler: MSVC
            configuration: Release
            target: EXE
            cheats: false
            name: MSVC Release EXE
          - compiler: MinGW
            configuration: Release
            target: DLL
            cheats: true
            name: MinGW Release DLL (cheats)
          - compiler: MSVC
            configuration: Release
            target: DLL
            cheats: true
            name: MSVC Release DLL (cheats)
          - compiler: MinGW
            configuration: Debug
            target: EXE
            cheats: true
            name: MinGW Debug EXE (cheats)
          - compiler: MinGW
            configuration: Debug
            target: EXE
            cheats: false
            trace: true
            name: MinGW Debug EXE (trace)
          - compiler: MSVC
            configuration: Release
            target: DLL
            cheats: true
            trace: true
            name: MSVC Release DLL (trace)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Restore verified downloads
        id: downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/downloads
          key: verified-downloads-v1-${{ runner.os }}-${{ hashFiles('ThirdParty/dependencies.json', 'tools/package-runtime-source.json', 'tools/download-verified.ps1', 'tools/fetch-dependencies.ps1', 'tools/setup-cmake.ps1', 'tools/setup-toolchain.ps1', 'tools/setup-directx-runtime.ps1') }}
      - name: Install pinned build tools
        shell: pwsh
        run: ./tools/setup-toolchain.ps1
      - name: Verify the pinned runtime and dependency archives
        shell: pwsh
        run: |
          ./tools/setup-directx-runtime.ps1
          ./tools/fetch-dependencies.ps1
      - name: Save verified downloads
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Restore the verified DirectX SDK subset
        if: matrix.compiler == 'MSVC'
        id: directx-sdk
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/directx-sdk
          key: directx-sdk-v1-${{ runner.os }}-${{ hashFiles('tools/download-verified.ps1', 'tools/setup-directx-sdk.ps1') }}
      - name: Get DirectX SDK headers and x86 libraries
        if: matrix.compiler == 'MSVC'
        shell: pwsh
        run: |
          ./tools/setup-directx-sdk.ps1
          "DXSDK_DIR=$(Join-Path $PWD '.tools/directx-sdk/DXSDK')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Save the verified DirectX SDK subset
        if: matrix.compiler == 'MSVC' && steps.directx-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/directx-sdk
          key: ${{ steps.directx-sdk.outputs.cache-primary-key }}
      - name: Build the selected configuration without local assets
        shell: pwsh
        run: |
          $buildParameters = @{
            Compiler = '${{ matrix.compiler }}'
            Configuration = '${{ matrix.configuration }}'
            WithoutResources = $true
          }
          if ('${{ matrix.target }}' -eq 'DLL') { $buildParameters.DLL = $true }
          if ('${{ matrix.cheats }}' -eq 'true') { $buildParameters.Cheats = $true }
          if ('${{ matrix.trace }}' -eq 'true') { $buildParameters.Trace = $true }
          ./tools/build.ps1 @buildParameters
      - name: Register hidden-window import containment checks
        shell: pwsh
        run: |
          $kind = '${{ matrix.target }}'.ToLowerInvariant()
          $buildName = '${{ matrix.compiler }}-${{ matrix.configuration }}-' + $kind
          $buildName = $buildName.ToLowerInvariant()
          if ('${{ matrix.trace }}' -eq 'true') { $buildName += '-trace' }
          & ./.tools/cmake-4.4.4-windows-i386/bin/cmake.exe -S . -B "build/$buildName" -DMATRIXGAME_NATIVE_WINDOW_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'Cannot register hidden-window containment checks.' }
      - name: Run engine contract tests
        shell: pwsh
        run: |
          $testParameters = @{
            Compiler = '${{ matrix.compiler }}'
            Configuration = '${{ matrix.configuration }}'
            NoBuild = $true
          }
          if ('${{ matrix.target }}' -eq 'DLL') { $testParameters.DLL = $true }
          if ('${{ matrix.cheats }}' -eq 'true') { $testParameters.Cheats = $true }
          if ('${{ matrix.trace }}' -eq 'true') { $testParameters.Trace = $true }
          ./tools/test.ps1 @testParameters
      - name: Validate real auto-order recordings
        shell: pwsh
        run: |
          $buildName = '${{ matrix.compiler }}-${{ matrix.configuration }}-${{ matrix.target }}'.ToLowerInvariant()
          if ('${{ matrix.trace }}' -eq 'true') { $buildName += '-trace' }
          python -B tests/check_player_auto_traces.py "build/$buildName/tests/scenario-traces"
          if ($LASTEXITCODE -ne 0) { throw 'Auto-order trace validation failed.' }
      - name: Upload engine test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.compiler }}-${{ matrix.configuration }}-${{ matrix.target }}-${{ matrix.cheats && 'cheats' || 'normal' }}${{ matrix.trace && '-trace' || '' }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/**/test-results.xml
            build/**/scenario-traces/*.jsonl
      - name: Validate complete mixed-selection recordings
        shell: pwsh
        run: |
          $kind = '${{ matrix.target }}'.ToLowerInvariant()
          $buildName = '${{ matrix.compiler }}-${{ matrix.configuration }}-' + $kind
          $buildName = $buildName.ToLowerInvariant()
          if ('${{ matrix.trace }}' -eq 'true') { $buildName += '-trace' }
          $revision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify selection recording revision.' }
          python -B tools/check-selection-traces.py "build/$buildName/tests/scenario-traces" --revision $revision --configuration '${{ matrix.configuration }}' --compiler '${{ matrix.compiler }}' --target '${{ matrix.target }}' --cheats '${{ matrix.cheats }}' --trace '${{ matrix.trace && 'true' || 'false' }}'
          if ($LASTEXITCODE -ne 0) { throw 'Mixed-selection recording validation failed.' }
      - name: Prepare the minimal standalone package
        if: matrix.compiler == 'MinGW' && matrix.configuration == 'Release' && matrix.target == 'EXE' && !matrix.cheats && !matrix.trace
        shell: pwsh
        run: ./tools/package.ps1
      - name: Upload standalone package and corresponding source
        if: matrix.compiler == 'MinGW' && matrix.configuration == 'Release' && matrix.target == 'EXE' && !matrix.cheats && !matrix.trace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: matrixgame-windows-x86-package
          if-no-files-found: error
          retention-days: 14
          path: |
            build/packages/*.zip
            build/packages/*.sha256
      - name: Upload compiled binaries and text configuration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: matrixgame-${{ matrix.compiler }}-${{ matrix.configuration }}-${{ matrix.target }}-${{ matrix.cheats && 'cheats' || 'normal' }}${{ matrix.trace && '-trace' || '' }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/**/MatrixGame.exe
            build/**/MatrixGame.dll
            build/**/MatrixGame.pdb
            build/**/MatrixGame/**/*.dll
            build/**/CFG/**/*.txt

  coverage:
    name: MinGW Debug coverage
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Restore verified downloads
        id: downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/downloads
          key: verified-downloads-v1-${{ runner.os }}-${{ hashFiles('ThirdParty/dependencies.json', 'tools/package-runtime-source.json', 'tools/download-verified.ps1', 'tools/fetch-dependencies.ps1', 'tools/setup-cmake.ps1', 'tools/setup-toolchain.ps1', 'tools/setup-directx-runtime.ps1') }}
      - name: Install pinned build tools
        shell: pwsh
        run: ./tools/setup-toolchain.ps1
      - name: Verify the pinned runtime and dependency archives
        shell: pwsh
        run: |
          ./tools/setup-directx-runtime.ps1
          ./tools/fetch-dependencies.ps1
      - name: Save verified downloads
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Collect engine contract coverage without local assets
        shell: pwsh
        run: ./tools/test.ps1 -Configuration Debug -Coverage
      - name: Publish the coverage summary
        shell: pwsh
        run: Get-Content -LiteralPath build/mingw-debug-exe-coverage/coverage/coverage-summary.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-MinGW-Debug-EXE
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/mingw-debug-exe-coverage/coverage/coverage.json
            build/mingw-debug-exe-coverage/coverage/coverage-summary.md
            build/mingw-debug-exe-coverage/test-results.xml

  required:
    name: Required checks
    if: always()
    needs: [policy, repository, build, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require repository and build jobs to succeed
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$REPOSITORY_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$COVERAGE_RESULT" = success
