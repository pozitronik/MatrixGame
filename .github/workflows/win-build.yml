name: Windows standalone CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master, 'epic/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Contribution policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate the label catalog and policy contracts
        run: |
          python3 -B .github/scripts/check-contribution-policy.py catalog
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

  repository:
    name: Repository checks
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify local-only content is excluded
        shell: pwsh
        run: ./tools/check-repository.ps1

  build:
    name: ${{ matrix.compiler }} ${{ matrix.configuration }} EXE
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: MinGW
            configuration: Debug
          - compiler: MinGW
            configuration: Release
          - compiler: MSVC
            configuration: Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned build tools
        shell: pwsh
        run: ./tools/setup-toolchain.ps1
      - name: Get DirectX SDK headers and x86 libraries
        if: matrix.compiler == 'MSVC'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'DXSDK_Jun10.exe'
          $destination = Join-Path $env:RUNNER_TEMP 'directx-sdk'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/a/e/7/ae743f1f-632b-4809-87a9-aa1bb3458e31/DXSDK_Jun10.exe' -OutFile $archive
          & 7z x $archive 'DXSDK/Include' 'DXSDK/Lib/x86' "-o$destination" -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { throw 'DirectX SDK extraction failed.' }
          $sdkRoot = Join-Path $destination 'DXSDK'
          if (-not (Test-Path "$sdkRoot/Include/d3dx9.h")) { throw 'DirectX headers missing.' }
          "DXSDK_DIR=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build standalone without local assets
        shell: pwsh
        run: ./tools/build.ps1 -Compiler '${{ matrix.compiler }}' -Configuration '${{ matrix.configuration }}' -WithoutResources
      - name: Upload compiled standalone and text configuration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standalone-${{ matrix.compiler }}-${{ matrix.configuration }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/**/MatrixGame.exe
            build/**/MatrixGame.pdb
            build/**/MatrixGame/**/*.dll
            build/**/CFG/**/*.txt

  required:
    name: Required checks
    if: always()
    needs: [policy, repository, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require repository and build jobs to succeed
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$REPOSITORY_RESULT" = success
          test "$BUILD_RESULT" = success
