name: Windows standalone CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master, 'epic/**']
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Contribution policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate the label catalog and policy contracts
        run: |
          python3 -B .github/scripts/check-contribution-policy.py catalog
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Validate pull request metadata
        if: github.event_name == 'pull_request'
        run: python3 -B .github/scripts/check-contribution-policy.py pr --input "$GITHUB_EVENT_PATH" --event

  repository:
    name: Repository checks
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify local-only content is excluded
        shell: pwsh
        env:
          CHECK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $base = $env:CHECK_BASE_SHA
          if (-not $base -or $base -match '^0+$') { $base = 'HEAD^' }
          ./tools/check-repository.ps1 -BaseRef $base

  build:
    name: ${{ matrix.name }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: MinGW
            configuration: Debug
            target: EXE
            cheats: false
            name: MinGW Debug EXE
          - compiler: MinGW
            configuration: Release
            target: EXE
            cheats: false
            name: MinGW Release EXE
          - compiler: MSVC
            configuration: Release
            target: EXE
            cheats: false
            name: MSVC Release EXE
          - compiler: MinGW
            configuration: Release
            target: DLL
            cheats: true
            name: MinGW Release DLL (cheats)
          - compiler: MSVC
            configuration: Release
            target: DLL
            cheats: true
            name: MSVC Release DLL (cheats)
          - compiler: MinGW
            configuration: Debug
            target: EXE
            cheats: true
            name: MinGW Debug EXE (cheats)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned build tools
        shell: pwsh
        run: ./tools/setup-toolchain.ps1
      - name: Get DirectX SDK headers and x86 libraries
        if: matrix.compiler == 'MSVC'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'DXSDK_Jun10.exe'
          $destination = Join-Path $env:RUNNER_TEMP 'directx-sdk'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/a/e/7/ae743f1f-632b-4809-87a9-aa1bb3458e31/DXSDK_Jun10.exe' -OutFile $archive
          & 7z x $archive 'DXSDK/Include' 'DXSDK/Lib/x86' "-o$destination" -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { throw 'DirectX SDK extraction failed.' }
          $sdkRoot = Join-Path $destination 'DXSDK'
          if (-not (Test-Path "$sdkRoot/Include/d3dx9.h")) { throw 'DirectX headers missing.' }
          "DXSDK_DIR=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the selected configuration without local assets
        shell: pwsh
        run: |
          $buildParameters = @{
            Compiler = '${{ matrix.compiler }}'
            Configuration = '${{ matrix.configuration }}'
            WithoutResources = $true
          }
          if ('${{ matrix.target }}' -eq 'DLL') { $buildParameters.DLL = $true }
          if ('${{ matrix.cheats }}' -eq 'true') { $buildParameters.Cheats = $true }
          ./tools/build.ps1 @buildParameters
      - name: Upload compiled binaries and text configuration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: matrixgame-${{ matrix.compiler }}-${{ matrix.configuration }}-${{ matrix.target }}-${{ matrix.cheats && 'cheats' || 'normal' }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/**/MatrixGame.exe
            build/**/MatrixGame.dll
            build/**/MatrixGame.pdb
            build/**/MatrixGame/**/*.dll
            build/**/CFG/**/*.txt

  required:
    name: Required checks
    if: always()
    needs: [policy, repository, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require repository and build jobs to succeed
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$REPOSITORY_RESULT" = success
          test "$BUILD_RESULT" = success
